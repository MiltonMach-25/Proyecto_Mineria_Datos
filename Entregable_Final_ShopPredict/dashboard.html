<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShopPredict Dashboard</title>
<style>
:root{--ink:#17213b;--bg:#eef2f8;--paper:#fff;--indigo:#4f46e5;--teal:#0d9488;--rose:#db315c;--line:#dde3ef}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Arial,sans-serif}.top{height:74px;display:flex;align-items:center;justify-content:space-between;padding:10px 28px;background:#11182d;color:white}.brand{display:flex;align-items:center;gap:10px}.brand img{height:54px}.brand b{display:block}.brand span{color:#aeb7cf;font-size:12px}.wrap{max-width:1180px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 12px 30px rgba(23,33,59,.07)}.metric{font-size:34px;font-weight:900}.label{color:#718096;font-size:12px;font-weight:800;text-transform:uppercase}.wide{grid-column:span 2}.status{margin-top:14px;padding:12px;border-left:4px solid #d97706;border-radius:10px;background:#fff8e8}.ok{border-left-color:var(--teal);background:#ecfdf8}.error{border-left-color:var(--rose);background:#fff0f3}canvas{width:100%;height:220px}.bar{height:18px;border-radius:999px;background:#e6eaf2;overflow:hidden}.bar div{height:100%;background:linear-gradient(90deg,var(--indigo),var(--teal))}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left}th{color:#667085;font-size:12px}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.wide{grid-column:span 2}}@media(max-width:600px){.grid{grid-template-columns:1fr}.wide{grid-column:span 1}.top{padding:10px 16px}}
</style>
</head>
<body>
<header class="top"><div class="brand"><img src="assets/shopredict-logo.png" alt="ShopPredict"><div><b>ShopPredict</b><span>Intención de Compra</span></div></div><a href="index.html" style="color:#fff;text-decoration:none;font-size:13px">Ver presentación</a></header>
<main class="wrap">
<div id="status" class="status">Sin configurar. El dashboard espera conexión con Supabase.</div>
<div class="grid" style="margin-top:14px">
<div class="card"><div id="total" class="metric">—</div><div class="label">Sesiones</div></div>
<div class="card"><div id="buy" class="metric">—</div><div class="label">Compras</div></div>
<div class="card"><div id="rate" class="metric">—</div><div class="label">Conversión</div></div>
<div class="card"><div id="duration" class="metric">—</div><div class="label">Duración promedio</div></div>
<div class="card wide"><h3>Comparación de modelos</h3><table id="models"><tr><th>Modelo</th><th>Accuracy</th><th>F1</th></tr></table></div>
<div class="card wide"><h3>Distribución de datos</h3><canvas id="chart"></canvas></div>
</div>
</main>
<script>
async function load(){
  const status=document.getElementById('status');
  try{
    const r=await fetch('/api/stats');
    if(!r.ok) throw new Error('Supabase no configurado o sin datos');
    const d=await r.json();
    document.getElementById('total').textContent=(d.total||0).toLocaleString('es-CO');
    document.getElementById('buy').textContent=(d.purchases||0).toLocaleString('es-CO');
    document.getElementById('rate').textContent=((d.conversion||0)*100).toFixed(2)+' %';
    document.getElementById('duration').textContent=Math.round(d.avg_duration||0).toLocaleString('es-CO')+' s';
    const table=document.getElementById('models');
    (d.models||[]).forEach(m=>{const tr=document.createElement('tr');tr.innerHTML='<td>'+m.name+'</td><td>'+Number(m.accuracy||0).toFixed(4)+'</td><td>'+Number(m.f1||0).toFixed(4)+'</td>';table.appendChild(tr)});
    status.textContent='Datos obtenidos desde Supabase.';
    status.className='status ok';
  }catch(e){status.textContent=e.message+'. Configura SUPABASE_URL y SUPABASE_ANON_KEY en Vercel.';status.className='status error'}
}
load();
</script>
</body>
</html>
